[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "career-intelligence"
version = "0.1.0"
description = "Multi-source data integration and search platform for occupations, skills, training and labour-market information."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary — academic project" }
authors = [{ name = "Elie Chahoud" }]
dependencies = [
    "requests>=2.32,<3",
    "python-dotenv>=1.0,<2",
    "PyYAML>=6.0,<7",
    "pandas>=2.2,<3",
    "openpyxl>=3.1,<4",
    "pyarrow>=15",
    "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9", "ruff>=0.6"]
# Local Spark execution (Databricks provides Spark/Delta at runtime).
# Not installed by default; pin to the Databricks runtime version once chosen.
spark = ["pyspark", "delta-spark"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
