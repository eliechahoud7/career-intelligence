# =============================================================================
# Application settings template (non-secret values only).
# Copy to config/settings.yaml (git-ignored) to override locally.
# Secrets are NEVER stored here — they come from environment variables
# (.env locally) or Databricks secret scopes.
# =============================================================================

project:
  name: career-intelligence
  environment: dev            # overridden by CI_ENV

databricks:
  # Unity Catalog names (Databricks Free Edition uses Unity Catalog)
  catalog: career_intelligence
  schemas:
    bronze: bronze            # raw API payloads, as ingested
    silver: silver            # cleaned, typed, deduplicated
    gold: gold                # integrated, search-ready tables
  # Unity Catalog volume for landing raw files
  landing_volume: landing

ingestion:
  http:
    timeout_seconds: 30
    max_retries: 3
    backoff_factor: 1.0
    user_agent: "career-intelligence/0.1 (academic project)"
  default_language: fr        # scope: France, French (confirmed in Phase 02)
  bmo:
    year: 2026                # edition must match the verified URL in sources.yaml

local:
  data_dir: data
  raw_dir: data/raw           # immutable downloaded files, as published
  staging_dir: data/staging   # Bronze-ready Parquet + manifests, to upload to Databricks
  sample_dir: data/sample

app:
  title: "Career Intelligence"
  page_size: 20

logging:
  level: INFO                 # overridden by CI_LOG_LEVEL
