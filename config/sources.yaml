# =============================================================================
# Data-source registry — Phase 02 verification results (2026-11-09).
#
# Scope: France, French language.
# Evidence and schema notes for every entry: docs/DATA_SOURCES.md.
#
# status values
#   verified               resource downloaded/called successfully, schema inspected
#   requires_registration  existence confirmed, but needs a francetravail.io account
#                          before resource paths/schemas can be verified
#   manual_download        file exists but cannot be fetched automatically
#   verified_manual        downloaded manually (no fetchable URL); content pinned by sha256
#   restricted             not available to this project at present
#
# Rules: a `url` is recorded ONLY if it was successfully requested during
# verification. Paths that could not be verified stay null. No credentials here.
# =============================================================================

verified_on: "2026-11-09"

sources:
