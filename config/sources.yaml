  - id: rome
    name: "ROME 4.0 — Répertoire Opérationnel des Métiers et des Emplois"
    publisher: "France Travail"
    domains: [occupations, skills]
    documentation: "https://www.data.gouv.fr/datasets/58da857388ee384902e505f5/"
    license: "Licence Ouverte / Open Licence (data.gouv.fr id: fr-lo)"
    version: "ROME 4.0 v62 (26M10), published 2026-10-19; ~2 releases per year"
    resources:
      - id: rome_bulk_csv
        type: bulk_download
        format: zip/csv
        url: "https://api.francetravail.fr/api-nomenclatureemploi/v1/open-data/csv"
        auth: none
        notes: "HTTP GET only (HEAD returns 404). 29 CSV files + version.txt; UTF-8 except arborescence_secteur_naf (cp1252); centre_interet / secteur_activite have multi-line cells and blank lines; type_referentiel is empty."
        status: verified
        connector: career_intelligence.ingestion.rome   # Phase 06 -> career_intelligence.bronze.rome_*
      - id: rome_bulk_json
        type: bulk_download
        format: zip/json
        url: "https://api.francetravail.fr/api-nomenclatureemploi/v1/open-data/json"
        auth: none
        notes: "Nested fiche_emploi_metier (1 doc per ROME). Encoded cp1252, NOT UTF-8."
        status: verified
      - id: rome_formacode
        type: bulk_download
        format: xlsx
        url: "https://www.francetravail.org/files/live/sites/peorg/files/documents/Statistiques-et-analyses/Open-data/ROME/261014-ref-formacode-v14-rome-26m10-v62-pour-open-data.xlsx"
        auth: none
        notes: "ROME v62 <-> Formacode V14 correspondence (5,958 rows). Filename changes each release."
        status: verified
        local_file: "rome_formacode_v14.xlsx"
        sha256: "1f1f144c25f6776b336fe78bc252ab2c23e715b222b191ef829f15264ca68d12"
        version: "ROME 4.0 version 62 - 26M10 x Formacode V14 (réalisé 15/10/2026, mis à disposition 19/10/2026; prochaine actualisation 23/03/2027)"
        snapshot: "rome_v62_formacode_v14"
        connector: career_intelligence.ingestion.formacode   # Phase 11 -> bronze.rome_formacode_v14
      - id: rome_api
        type: rest_api
        url: null            # resource paths only visible after francetravail.io login
        auth: oauth2_client_credentials
        auth_env_vars: [FRANCE_TRAVAIL_CLIENT_ID, FRANCE_TRAVAIL_CLIENT_SECRET]
        rate_limit: "1 call/second (data.gouv.fr)"
        notes: "4 APIs (Métiers, Compétences, Contextes de travail, Fiches métiers). Not needed: bulk files cover the same referential."
        status: requires_registration

